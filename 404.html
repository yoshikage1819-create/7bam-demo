    <style id="expo-reset">
      /* Handwriting for words on a Page (SIL Open Font License, see fonts/).
         Each file loads only when a character in its range is drawn. */
      @font-face {
        font-display: swap;
        font-family: 'ZineHand';
        src: url('fonts/architects-daughter.woff2') format('woff2');
        unicode-range: U+0020-007E, U+00A0-00FF, U+2013-2014, U+2018-2019, U+201C-201D, U+2026;
      }
      @font-face {
        font-display: swap;
        font-family: 'ZineHand';
        src: url('fonts/yomogi-ja.woff2') format('woff2');
        unicode-range: U+2190-21FF, U+2600-26FF, U+3000-30FF, U+4E00-9FFF, U+FF01-FF9F;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN',
          'Noto Sans JP', 'Yu Gothic UI', 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        /* No double-tap zoom on buttons; scrolling and pinch on the page stay. */
        touch-action: manipulation;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        flex: 1;
        height: 100%;
        /* Keeps content clear of the notch and the home indicator. */
        padding-bottom: env(safe-area-inset-bottom);
        padding-top: env(safe-area-inset-top);
        box-sizing: border-box;
      }
      /* Shown until the app script replaces the contents of #root. */
      .boot {
        align-items: center;
        color: #141414;
        display: flex;
        flex: 1;
        flex-direction: column;
        font-size: 44px;
        font-weight: 800;
        justify-content: center;
        letter-spacing: -1.5px;
      }
      .boot span {
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot span {
          animation: none;
        }
      }
    </style>

  <body>
    <noscript>このアプリを使うには、JavaScriptを有効にしてください。</noscript>
    <div id="root">
      <div class="boot" aria-label="7bamを読みこんでいます" role="status"><span>7bam</span></div>
    </div>
    <script>
      // A phone can keep an old copy of the app open for days (above all the
      // Home Screen app). When the app is looked at again after a long pause
      // and a newer build is published, the page is loaded again, once.
      (function () {
        var longPauseMs = 10 * 60 * 1000;
        var hiddenAt = 0;
        var checking = false;
        function currentScript() {
          var script = document.querySelector('script[src*="/_expo/static/js/"]');
          return script ? script.getAttribute('src') : null;
        }
        function check() {
          var mine = currentScript();
          if (!mine || checking) return;
          checking = true;
          fetch(location.pathname + '?fresh=' + Date.now(), { cache: 'no-store' })
            .then(function (response) {
              return response.ok ? response.text() : '';
            })
            .then(function (html) {
              var found = /src="([^"]*\/_expo\/static\/js\/[^"]+)"/.exec(html);
              if (!found || found[1] === mine) return;
              // Never twice for the same build, so a stale answer cannot loop.
              try {
                if (sessionStorage.getItem('7bam:reloaded-for') === found[1]) return;
                sessionStorage.setItem('7bam:reloaded-for', found[1]);
              } catch (error) {
                return;
              }
              location.reload();
            })
            .catch(function () {})
            .then(function () {
              checking = false;
            });
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') {
            hiddenAt = Date.now();
          } else if (hiddenAt > 0 && Date.now() - hiddenAt >= longPauseMs) {
            check();
          }
        });
        window.addEventListener('pageshow', function (event) {
          if (event.persisted) check();
        });
      })();
    </script>

</body>
